  turns:
    - say: What is the minimum deposit for a Standard account?
      expect: {route: faq, cited: true, has: ["100"]}
    - say: and for Raw?
      expect: {route: faq, cited: true, has: ["500"]}

- id: faq-demo-account
  category: faq
  turns:
    - say: How much virtual money does a demo account start with?
