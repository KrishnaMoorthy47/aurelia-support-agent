      expect: {route: faq, cited: true, has: ["1:30"], source: Margin and Leverage}

- id: faq-leverage-crypto
  category: faq
  turns:
    - say: What leverage do I get on bitcoin CFDs?
      expect: {route: faq, cited: true, has: ["re:1:2(?!\\d)"]}

