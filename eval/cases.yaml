      expect: {route: faq, cited: true, has: [[negative balance, "cannot lose more", "can't lose more", "restores it to zero", "restore it to zero", "back to zero"]]}

- id: faq-paraphrase-cutoff
  category: faq
  note: No FAQ keyword in the message, so the rules alone call this out of scope. The LLM router has to recognise it.
  turns:
    - say: If I ask to take my money out at 4pm, when does it actually get processed?
      expect: {route: faq, cited: true, has: [["14:00", "2pm", "2 pm", "next business day"]]}

