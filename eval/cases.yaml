# ------------------------------------------------------------------ not in the documents: must not invent
- id: unknown-copy-trading
  category: no_answer
  turns:
    - say: Do you offer copy trading?
      expect: {route: [faq, out_of_scope], has: [["don't have", "do not have", "not able to", "no information", "only help with", "log a ticket", "not mentioned", "isn't covered", "not covered"]]}

- id: unknown-tesla-spread
  category: no_answer
  turns:
    - say: What is the spread on Tesla shares?
      expect: {route: [faq, out_of_scope], has: [["don't have", "do not have", "not able to", "no information", "log a ticket", "not listed", "not mentioned", "isn't covered", "not covered"]], has_not: ["re:tesla[^.]{0,40}\\d+(\\.\\d+)? ?(pip|usd|cent)"]}

