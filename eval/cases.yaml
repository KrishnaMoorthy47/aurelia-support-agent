# Scripted conversations for the evaluation harness (eval/run_eval.py).
#
# Each case is one conversation. Each turn either says something as the customer (`say`)
# or plays the human reviewer (`decide`). `expect` checks run on that turn's result:
#
#   route:        expected route (string, or list of acceptable routes)
#   status:       done | pending_approval
#   has:          every item must appear in the reply. An item that is a list means "any of these".
#                 Matching is case-insensitive; thousands separators are ignored (write 5000, not 5,000).
#                 Prefix an item with "re:" to use a regex.
#   has_not:      none of these may appear in the reply
#   cited:        true -> at least one source chip must be returned
#   source:       substring that at least one returned source must contain
#
# On EVERY turn the harness also runs the compliance check (no advice, predictions, or guarantees).

# ------------------------------------------------------------------ FAQ (grounded RAG answers)
- id: faq-withdrawal-fee
  category: faq
  turns:
    - say: How much does it cost to withdraw money?
      expect: {route: faq, cited: true, has: [[free], ["10 usd", "usd 10", "$10", "10 dollars"]], source: Withdrawal fees}

- id: faq-leverage-majors
  category: faq
  turns:
