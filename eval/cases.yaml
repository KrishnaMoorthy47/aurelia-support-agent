# ------------------------------------------------------------------ limit exceptions (human in the loop)
- id: limit-approved
  category: human_in_loop
  customer: C-1004
  turns:
    - say: Please raise my daily withdrawal limit to 5000 USD because I need to pay university tuition
      expect: {route: limit_exception, status: pending_approval}
    - decide: {approved: true, reviewer: eval-reviewer}
      expect: {status: done, has: ["approved", "5000"]}

- id: limit-multiturn-declined
  category: human_in_loop
  customer: C-1002
  note: The agent collects the amount and the reason over several turns before asking a human.
  turns:
    - say: Can you increase my withdrawal limit?
      expect: {route: limit_exception, status: done, has: ["what daily withdrawal limit"]}
    - say: "8000"
      expect: {route: limit_exception, status: done, has: ["reason"]}
    - say: I need it to pay a deposit on a flat
      expect: {route: limit_exception, status: pending_approval}
    - decide: {approved: false, reviewer: eval-reviewer, note: proof of address is still missing}
      expect: {status: done, has: ["could not approve", "proof of address"]}

- id: limit-over-ceiling
  category: human_in_loop
  customer: C-1004
  note: Anything above the next tier's limit is refused by the policy check and never reaches a reviewer.
  turns:
    - say: Raise my withdrawal limit to 50000 because I'm buying a house
      expect: {route: limit_exception, status: done, has: ["can't send that request"]}

- id: limit-tier2-approved
  category: human_in_loop
  customer: C-1001
  turns:
    - say: Increase my withdrawal limit to 20000 for a property purchase
      expect: {route: limit_exception, status: pending_approval}
    - decide: {approved: true, reviewer: eval-reviewer}
      expect: {status: done, has: ["20000"]}

- id: limit-not-signed-in
  category: human_in_loop
  turns:
    - say: Please raise my withdrawal limit to 5000
      expect: {route: limit_exception, has: ["sign in"]}

